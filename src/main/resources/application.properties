spring.application.name=bidyatra-staff-system
server.port=8080

# Database Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://mongodb:27017/bidyatra_staff}

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:BidYatra-Change-This-Secret-To-A-Long-Random-Production-Key-2026}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Admin Seed Configuration
app.admin.username=${APP_ADMIN_USERNAME:admin@bidyatra.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@12345}
app.admin.otp-recipient=${APP_ADMIN_OTP_RECIPIENT:${spring.mail.username}}

# Timezone Configuration
spring.jackson.time-zone=Asia/Kolkata

# Brevo SMTP Mail Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:rrk155889@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false

# Connection Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000